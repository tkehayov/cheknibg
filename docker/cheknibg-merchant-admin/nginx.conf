user  nginx;
worker_processes  1;
events {
  worker_connections  1024;
}

http {
  include /etc/nginx/mime.types;
  server {
    listen 80;

    location / {
        root /web/build/;
        index index.html;

        try_files $uri /index.html;
    }

    location /products-service {
          proxy_pass http://$API_GATEWAY:9090;
    }

    location /merchants-service {
          proxy_pass http://$API_GATEWAY:9090;
    }

    location /auth {
          proxy_pass http://$API_GATEWAY:9090;
    }
  }
}