server:
  port: 9090

spring:
  application:
    name: API-GATEWAY-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5434/auth
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # a day
      refresh-token:
        expiration: 604800000 # 7 days

service:
  uri:
    products: http://localhost:8080
    merchants: http://localhost:8070
    finance: http://localhost:9091

management:
  server:
    port: 8093
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - prometheus

loki:
  url: http://localhost:3100/loki/api/v1/push