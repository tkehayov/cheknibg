server.port=8080
management.server.port=8091
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus

spring.datasource.url=jdbc:postgresql://localhost:5432/products
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

## Hibernate Search - Lucene indexing
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.lucene_version=LATEST
spring.jpa.properties.hibernate.search.backend.directory.root=./lucene-index
spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-update

server.servlet.contextPath=/api

merchant.settings.url=http://localhost:8070/api/merchants-settings
service.images.url=http://localhost:8081
spring.servlet.multipart.enabled=true
spring.http.multipart.max-file-size=10MB
spring.http.multipart.max-request-size=11MB

#spring.jpa.show-sql=true
#
## Makes the SQL readable (pretty-print)
#spring.jpa.properties.hibernate.format_sql=true

spring.mvc.async.request-timeout=30000

loki.url=http://localhost:3100/loki/api/v1/push
