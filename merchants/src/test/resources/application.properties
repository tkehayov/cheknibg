spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:/changelog/changelog-masters.xml
spring.liquibase.contexts=test
spring.liquibase.enabled=true
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.lucene_version=LATEST
spring.jpa.properties.hibernate.search.backend.directory.type=local-heap
service.images.url=
merchant.settings.url=
loki.url=
logging.level.org.hibernate.boot=TRACE

spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-validate
spring.jpa.properties.hibernate.search.automatic_indexing.synchronization.strategy=sync